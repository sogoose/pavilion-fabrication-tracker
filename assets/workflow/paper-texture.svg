<svg xmlns="http://www.w3.org/2000/svg" width="160" height="160" viewBox="0 0 160 160" aria-hidden="true">
  <!-- Transparent, repeatable fine-fibre overlay for low-contrast craft paper. -->
  <defs>
    <filter id="fineFibres" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="3" seed="11" stitchTiles="stitch" result="noise"/>
      <feColorMatrix in="noise" type="matrix" values="
        0 0 0 0 .34
        0 0 0 0 .28
        0 0 0 0 .22
        .36 0 0 0 -.14" result="fibre"/>
    </filter>
  </defs>
  <rect width="160" height="160" fill="transparent" filter="url(#fineFibres)"/>
</svg>