  <script>

  (function(){
    "use strict";
    var pictures="../assets/workflow/";
    var data=[
      {
        title:"THE AMBITION",lead:"How can one brick become a pavilion that adapts to different spaces?",color:"#ccc7c1",image:"spatial.svg",
        gallery:[["decor/printed-module.webp","The component"],["assembly.svg","Assembly logic"]],
        paragraphs:[
          "Instead of designing one fixed pavilion for one predetermined exhibition site, we developed a reconfigurable building system. Its form can change according to the available space and the number of components.",
          "Our starting point was not a complete wall, but a single earthen brick. A cube first gave way to rounded cylinders because sharp turns were difficult for the printing nozzle. Connecting these cylinders formed a wall; adding a third support created a triangular arrangement that improved lateral stability.",
          "The three cylinders are the principal load-bearing parts. Connecting walls create continuity while leaving room for material-efficient openings. These openings become larger towards the top of the wall, reducing weight where less mass is needed.",
          "The geometry is not the result of one isolated formal idea. It emerged by negotiating structural logic, compression, material use and the realities of robotic printing."
        ],quote:"ONE COMPONENT → MANY CONFIGURATIONS"
      },
      {
        title:"THE MATERIALS",lead:"Earth is familiar. Making it printable is another story.",color:"#b2aba2",image:"material.svg",
        gallery:[["decor/rammed-block.webp","Compacted earth"],["decor/printed-module.webp","Printed earth"]],
        paragraphs:[
          "A printable earth mixture must be fluid enough to pass through a nozzle, but stable enough to carry the next layer. Too much clay can increase water demand and shrinkage; too little may not bind the sand adequately.",
          "The material team began with small pancake tests, then larger cake samples, comparing clay and sand ratios and exploring fibres such as sawdust, cellulose and bamboo. Testing in the actual machine revealed problems that bench tests alone could not show, including blocked nozzles and poor extrusion.",
          "Chamotte was introduced to improve extrusion, contributing to a workable mixture of clay, sand, chamotte and sawdust. Material development and machine behaviour proved inseparable.",
          "Rammed-earth components required almost the opposite approach: a relatively dry mixture compacted into a mould. These heavier blocks form the base, while lighter printed components are placed above."
        ],quote:"THE MATERIAL HAS TO WORK WITH THE MACHINE — AND VICE VERSA."
      },
      {
        title:"THE TRANSLATION",lead:"A robot cannot read an architectural drawing. It needs a language of motion.",color:"#7c7367",image:"gcode.svg",
        gallery:[["../exhibition/translation-blue-model.svg","Printed layers"],["../exhibition/translation-robot-line.svg","Robot motion"]],
        paragraphs:[
          "The digital component had to be translated into precise movements: where the robot travels, where it deposits material and how it transitions between paths. Conventional slicers were a starting point, but many strategies developed for rapidly solidifying plastics do not work well for wet clay.",
          "To avoid unsupported strands and intersections where material accumulates, the team experimented with customised infill. Sharp zigzags gradually developed into smoother sinusoidal paths that printed more reliably.",
          "Material distribution was also adjusted according to the geometry. Cylinders needed denser internal support, while connecting walls could be lighter; arches required local reinforcement. Tests suggested that carefully patterned infill could outperform a solid reference under the tested conditions.",
          "Our workflow spans WASP, Comau and UR5 systems, alongside a fabrication website that records each module and its parameters. Meanwhile, rammed-earth moulds combined 3D-printed PLA corners with conventional timber panels, cutting the production effort."
        ],quote:"THE DESIGN IS NOT THE CODE. THE TOOLPATH IS THE TRANSLATION."
      },
      {
        title:"THE REALITY",lead:"The robot stops. The material keeps changing.",color:"#3c3832",image:"environment.svg",
        gallery:[["decor/printed-module.webp","Printed sample"],["decor/rammed-blocks.webp","Fabricated components"]],
        paragraphs:[
          "Two bricks can follow the same digital geometry and still look different once they dry. As water evaporates, earthen materials shrink; depending on their shapes, mixtures and surroundings, they can warp or crack.",
          "The team studied humidity and temperature using sensors and a custom drying enclosure with mist makers. The aim was to make drying conditions more consistent and to understand how material behaviour might be better anticipated.",
          "In the reported ongoing tests, circular samples showed no cracking, whereas rectangular samples exhibited some edge warping. These observations do not establish universal rules, but they invite us to reconsider geometry from the perspective of drying.",
          "A rounded corner can aid both robotic motion and material performance. Infill, mixture, geometry and climate no longer appear as separate questions; each has consequences for the others."
        ],quote:"FABRICATION DOES NOT END WHEN PRINTING ENDS."
      },
      {
        title:"THE FUTURE",lead:"What if each experiment could inform the next one?",color:"#d7d5d3",image:"hrc.svg",
        gallery:[["computational.svg","Data and feedback"],["assembly.svg","Adaptive assembly"]],
        paragraphs:[
          "Making dozens of components produces more than a wall. It produces records: material compositions, printing settings, production time, test observations and failures. These data can become a shared resource rather than isolated trials.",
          "We are exploring machine-learning workflows for prediction, optimisation and iterative suggestions. A model might estimate strength from existing test data, suggest parameters for a target performance, and point researchers towards experiments that would close important knowledge gaps.",
          "Reconfigurability also creates questions about assembly. We are investigating how human-robot interaction, augmented reality and computer vision could help preview alternate wall configurations before physically lifting heavy earthen blocks.",
          "The longer-term ambition is a connected cycle: design, experiment, fabricate, observe and use the results to improve the next iteration."
        ],quote:"A PAVILION AS A SYSTEM THAT CAN LEARN."
      }
    ];
    var dialog=document.getElementById("chapterDialog"), current=0, lastTrigger=null;
    function make(tag,cls,text){var el=document.createElement(tag);if(cls)el.className=cls;if(text!==undefined)el.textContent=text;return el}
    function galleryItem(source,caption){
      var fig=make("figure","gallery-item"),im=document.createElement("img");
      im.src=pictures+source;im.alt=caption;im.loading="lazy";
      fig.append(im,make("span",null,caption));return fig
    }
    function render(i){
      current=Math.max(0,Math.min(data.length-1,i));var chapter=data[current],id=String(current+1).padStart(2,"0");
      document.getElementById("dialogCounter").textContent=id+" / 05";
      document.getElementById("chapterCount").textContent=id+" / 05";
      document.getElementById("dialogLabel").textContent="CHAPTER "+id+" / FIVE";
      document.getElementById("dialogTitle").textContent=chapter.title;
      document.getElementById("dialogLead").textContent=chapter.lead;
      document.getElementById("tarotNumber").textContent=id;
      document.getElementById("tarotFooter").textContent=chapter.title;
      document.getElementById("tarot").style.setProperty("--accent",chapter.color);
      document.getElementById("tarot").style.setProperty("--card-ink",current===2||current===3?"#fffdf8":"#302b25");
      document.getElementById("tarot").style.setProperty("--card-filter",current===2||current===3?"invert(1)":"brightness(1)");
      var art=document.getElementById("tarotImage");art.src=pictures+chapter.image;art.alt=chapter.title+" visual";
      var gal=document.getElementById("dialogGallery");gal.replaceChildren();
      chapter.gallery.forEach(function(entry){gal.appendChild(galleryItem(entry[0],entry[1]))});
      var body=document.getElementById("dialogCopy");body.replaceChildren();
      chapter.paragraphs.forEach(function(p){body.appendChild(make("p",null,p))});
      document.getElementById("dialogQuote").textContent=chapter.quote;
      document.getElementById("prevChapter").disabled=current===0;
      document.getElementById("nextChapter").disabled=current===data.length-1;
      dialog.scrollTop=0;
      window.history.replaceState(null,"","#chapter-"+id);
    }
    function openChapter(i){
      lastTrigger=document.activeElement;
      render(i);
      if(!dialog.open)dialog.showModal();
      document.getElementById("closeDialog").focus();
    }
    document.querySelectorAll("[data-chapter]").forEach(function(el){
      el.addEventListener("click",function(){openChapter(Number(el.dataset.chapter))});
    });
    document.getElementById("closeDialog").addEventListener("click",function(){dialog.close()});
    document.getElementById("prevChapter").addEventListener("click",function(){if(current>0)render(current-1)});
    document.getElementById("nextChapter").addEventListener("click",function(){if(current<data.length-1)render(current+1)});
    dialog.addEventListener("click",function(e){if(e.target===dialog)dialog.close()});
    dialog.addEventListener("close",function(){
      if(window.location.hash.startsWith("#chapter-"))window.history.replaceState(null,"",window.location.pathname+window.location.search);
      if(lastTrigger&&lastTrigger.focus)lastTrigger.focus()
    });
    document.addEventListener("keydown",function(e){
      if(!dialog.open)return;
      if(e.key==="ArrowRight"&&current<4){render(current+1)}
      if(e.key==="ArrowLeft"&&current>0){render(current-1)}
    });
    var match=location.hash.match(/^#chapter-0?([1-5])$/);
    if(match)openChapter(Number(match[1])-1);
  })();
  </script>

<script>
(function(){
  const posters=[...document.querySelectorAll(".rev-poster")];
  const items=[...document.querySelectorAll(".rev-index-item")];
  if(!("IntersectionObserver" in window))return;
  const observer=new IntersectionObserver(function(entries){
    const visible=entries.filter(x=>x.isIntersecting).sort((a,b)=>b.intersectionRatio-a.intersectionRatio);
    if(!visible.length)return;
    const selected=Number(visible[0].target.id.slice(-2))-1;
    items.forEach(function(item){item.classList.toggle("is-current",Number(item.dataset.chapter)===selected)});
  },{threshold:[0,.05,.12,.25,.45],rootMargin:"-12% 0px -35% 0px"});
  posters.forEach(p=>observer.observe(p));
})();
</script>

<script>
(function(){
 const names=['Grey clay','Red clay','Silver sand','Chamotte','Sawdust','Stone','Concrete mix','Masonry sand'];
 const viewer=document.getElementById('materialDialog');let current=0,trigger=null;
 function show(index){current=(index+names.length)%names.length;const image=document.getElementById('materialFullImage');image.src='../assets/exhibition/material-cards/'+String(current+1).padStart(2,'0')+'.png';image.alt=names[current]+' — material source and description';document.getElementById('materialName').textContent=names[current].toUpperCase();document.getElementById('materialCount').textContent=String(current+1).padStart(2,'0')+' / 08';}
 document.querySelectorAll('[data-material]').forEach(button=>button.addEventListener('click',()=>{trigger=button;show(Number(button.dataset.material));viewer.showModal();document.getElementById('materialClose').focus()}));
 document.getElementById('materialClose').addEventListener('click',()=>viewer.close());
 document.getElementById('materialPrev').addEventListener('click',()=>show(current-1));
 document.getElementById('materialNext').addEventListener('click',()=>show(current+1));
 viewer.addEventListener('click',event=>{if(event.target===viewer)viewer.close()});
 viewer.addEventListener('keydown',event=>{if(event.key==='ArrowRight'){event.preventDefault();event.stopPropagation();show(current+1)}if(event.key==='ArrowLeft'){event.preventDefault();event.stopPropagation();show(current-1)}});
 viewer.addEventListener('close',()=>{if(trigger)trigger.focus()});
})();
</script>
